name: TestPilot CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-and-unit-test:
    name: 🧪 Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Workspace Dependencies
        run: npm run install:all

      - name: Run Backend Unit Tests
        run: npm test --workspace=server

      - name: Verify Client Production Build (Vite)
        run: npm run build --workspace=client

  integration-verification:
    name: 🚀 Integration & Target API Test Execution
    needs: lint-and-unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm run install:all

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Start Target Sample API & Backend Engine in Background
        run: |
          npm run dev:sample-api &
          npm run dev:server &
          sleep 5

      - name: Verify Server Health Endpoint
        run: |
          curl --retry 5 --retry-connrefused --retry-delay 2 http://localhost:5000/api/health
          curl --retry 5 --retry-connrefused --retry-delay 2 http://localhost:4000/api/users
