# TestPilot Configuration File (application.properties)

# Server Configuration
server.port=5000
server.env=development
server.log.level=info

# Database Configuration
mongodb.uri=mongodb://127.0.0.1:27017/testpilot

# Security & Authentication Configuration
jwt.secret=testpilot_default_super_secret_jwt_key_2026
client.url=http://localhost:5173

# Execution Safety & Timeouts
request.timeout.ms=15000
max.response.bytes=1048576

# Google Gemini API Configuration (Gemini Pro / Free Tier)
# Provide your key in local .env or application.properties (never commit API keys)
gemini.api.key=
gemini.model=gemini-1.5-pro

# Optional OpenAI Configuration
openai.api.key=
openai.model=gpt-4o-mini

# Optional AI Configuration (Local / Ollama)
ollama.base.url=http://localhost:11434
ollama.model=llama3.2
